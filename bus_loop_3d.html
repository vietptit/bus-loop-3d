<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#79d14c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Bus Loop 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root { font-family: 'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; color: #5b3a2c;
  --ink: #5b3a2c; --cream: #fff6e6; --cream2: #f6e2c4; --line: #6b4433; }
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
body { display: flex; align-items: center; justify-content: center; background: #3b2a30; }
button { font: inherit; border: 0; cursor: pointer; padding: 0; transition: transform .08s ease, filter .1s; touch-action: manipulation; }
button:active { transform: translateY(3px) scale(.95); }
.outline { color: #fff; text-shadow: -2px -2px 0 var(--line), 2px -2px 0 var(--line), -2px 2px 0 var(--line), 2px 2px 0 var(--line), 0 3px 0 var(--line); }

.shell { position: relative; height: min(96dvh, 900px); aspect-ratio: 9/16; max-width: 100vw; border-radius: 34px; overflow: hidden;
  background: linear-gradient(180deg, #f7d6d2 0%, #f9e3cf 50%, #f4d2b8 100%); box-shadow: 0 0 0 6px #22161a, 0 30px 80px rgba(0,0,0,.55); }
@media (max-width: 600px) { .shell { position: fixed; inset: 0; width: 100vw; height: 100dvh; aspect-ratio: auto; border-radius: 0; box-shadow: none; } }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* chunky cream panel look */
.panel { background: linear-gradient(180deg, var(--cream) 0%, var(--cream2) 100%); border: 3px solid var(--line); border-radius: 18px;
  box-shadow: inset 0 -4px 0 rgba(107,68,51,.18), inset 0 3px 0 #fff, 0 3px 0 var(--line); }

/* ---------- HUD ---------- */
.hud { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.pill { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 2px; border-radius: 99px; font-weight: 700; font-size: 19px; color: var(--ink); }
.pill.bump, .cnt.bump { animation: bump .3s; }
.coin { width: 36px; height: 36px; margin-left: -8px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 700; color: #a65a00;
  background: radial-gradient(circle at 35% 30%, #fff7a8, #ffcf2e 45%, #f39a12); border: 3px solid var(--line); box-shadow: inset 0 -3px 0 #d07a00; }
.level { padding: 4px 22px 5px; border-radius: 16px; font-weight: 700; font-size: 22px; letter-spacing: .3px;
  background: linear-gradient(180deg, #c48bff 0%, #8f4fe8 100%); border: 3px solid var(--line);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(60,20,110,.35), 0 3px 0 var(--line); }
.right { display: flex; gap: 6px; }
.rbtn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 19px; }

.toast { position: absolute; z-index: 5; top: calc(max(10px, env(safe-area-inset-top)) + 54px); left: 50%; transform: translateX(-50%);
  max-width: 94%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
  font-weight: 600; font-size: 15px; padding: 5px 16px; border-radius: 99px; color: var(--ink); }
.toast.bad { background: linear-gradient(#ff8a7a, #f0574a); color: #fff; }
.toast.good { background: linear-gradient(#8ee68a, #4cc45a); color: #fff; }
.toast.pop { animation: tpop .35s ease; }
@keyframes tpop { 0% { transform: translateX(-50%) scale(.6); } 60% { transform: translateX(-50%) scale(1.08); } 100% { transform: translateX(-50%) scale(1); } }

/* ---------- Dock ---------- */
.dock { position: absolute; z-index: 5; left: 10px; right: 10px; bottom: max(12px, env(safe-area-inset-bottom));
  display: flex; align-items: flex-end; gap: 8px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.boosts { display: flex; gap: 6px; }
.boost { width: 48px; height: 48px; border-radius: 15px; font-size: 22px; display: grid; place-items: center; flex: none; color: var(--ink); }
.boost.on { background: linear-gradient(#fff3a6, #ffd24a); }
.mid { flex: 1; min-width: 0; display: flex; justify-content: center; pointer-events: none; }
.cnt { display: flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 14px; font-weight: 700; font-size: 19px; white-space: nowrap; color: var(--ink); }
@keyframes bump { 50% { transform: scale(1.2); } }
.play { flex: none; white-space: nowrap; height: 58px; padding: 0 18px; border-radius: 20px; font-weight: 700; font-size: 22px;
  background: linear-gradient(180deg, #c48bff 0%, #8f4fe8 100%); border: 3px solid var(--line);
  box-shadow: inset 0 4px 0 rgba(255,255,255,.4), inset 0 -5px 0 rgba(60,20,110,.35), 0 4px 0 var(--line); }
.play.off { filter: saturate(.35) brightness(1.05); }
.play.ready { animation: pulse .85s infinite ease-in-out; }
.play.run { background: linear-gradient(180deg, #ffd36a 0%, #ff9d2e 100%); }
@keyframes pulse { 50% { transform: scale(1.07); } }

/* ---------- FX overlays ---------- */
.hand { position: absolute; z-index: 4; font-size: 44px; pointer-events: none; transform: translate(-30%, -10%); filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); display: none; }
.ripple { position: absolute; z-index: 4; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 4px solid #fff; pointer-events: none;
  background: rgba(255,255,255,.25); opacity: 0; transform: scale(.4); transition: opacity .12s, transform .12s; }
.ripple.on { opacity: 1; transform: scale(1); }
.flycoin { position: absolute; z-index: 7; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 30%, #fff7a8, #ffcf2e 45%, #f39a12); border: 2.5px solid var(--line);
  transition: left .6s cubic-bezier(.5,-0.3,.7,1), top .6s cubic-bezier(.3,.6,.6,1), transform .6s; }
.confetti { position: absolute; z-index: 9; top: -20px; width: 10px; height: 16px; border-radius: 3px; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

/* ---------- Modal ---------- */
.modal { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; padding: 22px; background: rgba(60,30,40,.45); }
.modal.hidden { display: none; }
.card { width: min(320px, 100%); text-align: center; padding: 44px 18px 18px; border-radius: 28px; position: relative; animation: cardIn .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes cardIn { from { transform: scale(.4) translateY(40px); opacity: 0; } }
.ribbon { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 8px 26px; border-radius: 16px;
  font-weight: 700; font-size: 26px; border: 3px solid var(--line);
  background: linear-gradient(180deg, #ff9c8a 0%, #ee5a55 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(110,20,20,.3), 0 3px 0 var(--line); }
.ribbon.win { background: linear-gradient(180deg, #9af08a 0%, #46be55 100%); }
.stars { display: none !important; }
.big { font-size: 66px; line-height: 1; margin: 4px 0 6px; animation: wob 1.2s infinite ease-in-out; }
@keyframes wob { 50% { transform: rotate(-8deg) scale(1.06); } }
.card p { margin: 6px 0 14px; font-weight: 600; font-size: 16px; line-height: 1.35; color: var(--ink); }
.mbtn { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 16px; font-weight: 700; font-size: 21px; border: 3px solid var(--line);
  background: linear-gradient(180deg, #c48bff 0%, #8f4fe8 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(60,20,110,.35), 0 3px 0 var(--line); }
.mbtn.alt { background: linear-gradient(180deg, #fff6e6 0%, #f6e2c4 100%); color: var(--ink); text-shadow: none; }

.loading { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;
  background: #f9e3cf; color: var(--ink); font-weight: 700; font-size: 20px; }
.loading.hidden { display: none; }
.spin { width: 44px; height: 44px; border-radius: 50%; border: 6px solid rgba(107,68,51,.25); border-top-color: var(--line); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- level select ---------- */
.level { cursor: pointer; }
.lsel .card { width: min(360px, 100%); max-height: 82dvh; display: flex; flex-direction: column; padding: 40px 12px 12px; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.lgrid { overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; padding: 4px 2px 6px; }
.lv { position: relative; aspect-ratio: 1; border-radius: 14px; font-weight: 700; font-size: 19px; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.lv small { font-size: 11px; letter-spacing: -1px; }
.lv.mech { background: linear-gradient(180deg, #e8d6ff 0%, #c9a8ff 100%); }
.lv.intro { background: linear-gradient(180deg, #fff3a6 0%, #ffcc3a 100%); box-shadow: 0 0 0 3px #ff9d2e, inset 0 3px 0 #fff, 0 3px 0 var(--line); }
.lv.cur { outline: 3px dashed #8f4fe8; outline-offset: 2px; }
.lv .new { position: absolute; top: -7px; right: -6px; font-size: 9px; padding: 1px 4px; border-radius: 6px; background: #ee5a55; color: #fff; border: 2px solid var(--line); }

/* ===== v3 theme ===== */
:root { --ink: #173b7a; --line: #13306b; --cream: #fffbea; --purple1: #47c6ff; --purple2: #1a7cf2; }
.shell { background: linear-gradient(180deg, #5fd3ff 0%, #a8ecff 45%, #fff3b0 100%) !important; }
.panel { background: linear-gradient(180deg, var(--purple1) 0%, var(--purple2) 100%); border: 3px solid var(--line); color: #fff;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(30,0,80,.35), 0 3px 0 var(--line); }
.pill.panel, .cnt.panel, .toast.panel { color: #fff; text-shadow: 0 2px 0 var(--line); }
.boost.panel, .rbtn.panel { color: #fff; }
.boost.on { background: linear-gradient(#ffe66b, #ffad0d); }
.level { background: linear-gradient(180deg, #ffd84a 0%, #ff9f1c 100%) !important; white-space: nowrap; padding: 4px 14px 5px; font-size: 20px; }
.play { background: linear-gradient(180deg, #7ff05c 0%, #24b33a 100%); }
.play.run { background: linear-gradient(180deg, #ffd84a 0%, #ff9f1c 100%); }
.card.panel { background: linear-gradient(180deg, #4cc8ff 0%, #1673e6 100%); }
.card p { color: #fff; text-shadow: 0 2px 0 var(--line); }
.mbtn { background: linear-gradient(180deg, #7ff05c 0%, #24b33a 100%); }
.mbtn.alt { background: linear-gradient(180deg, #ffd84a 0%, #ff9f1c 100%); color: #fff; text-shadow: 0 2px 0 var(--line); }
.mbtn.ghost { background: linear-gradient(180deg, #fff7e8, #f1dcc0); color: var(--ink); text-shadow: none; }
.ribbon { background: linear-gradient(180deg, #ff8a7a 0%, #e8473f 100%); border-radius: 12px; clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); padding: 8px 34px; }
.ribbon.win { background: linear-gradient(180deg, #8ff06a 0%, #2cb83f 100%); }
.ribbon.info { background: linear-gradient(180deg, #ffd84a 0%, #ff9f1c 100%); }
.lv.panel { background: linear-gradient(180deg, #fff7e8, #f1dcc0); color: var(--ink); text-shadow: none; }
.lv.mech { background: linear-gradient(180deg, #ffd1ec 0%, #ff8fca 100%); }
.lv.intro { background: linear-gradient(180deg, #fff3a6 0%, #ffcc3a 100%); }
.legend { color: #fff; text-shadow: 0 2px 0 var(--line); }
.modal { background: rgba(10, 40, 100, .45); }
.inner { background: var(--cream); color: var(--ink); border: 3px solid var(--line); border-radius: 16px; padding: 10px; margin: 6px 0 10px; text-shadow: none; font-weight: 600; }

/* ----- home screen ----- */
.shell.at-home .hud, .shell.at-home .toast, .shell.at-home .dock { visibility: hidden; }
.home { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(180deg, rgba(70,200,255,.92) 0%, rgba(150,230,255,.85) 50%, rgba(255,236,140,.92) 100%); }
.home.hidden { display: none; }
.home .top { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: max(12px, env(safe-area-inset-top)) 12px 0; }
.home .hearts { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 4px; border-radius: 99px; font-weight: 700; font-size: 18px; }
.heart { font-size: 26px; margin-left: -6px; filter: drop-shadow(0 2px 0 var(--line)); }
.logo { margin-top: 9dvh; text-align: center; line-height: .95; transform: rotate(-4deg); }
.logo b { display: block; font-size: 64px; color: #ffd84a; letter-spacing: 2px; text-shadow: -4px -4px 0 var(--line), 4px -4px 0 var(--line), -4px 4px 0 var(--line), 4px 4px 0 var(--line), 0 9px 0 var(--line); }
.logo b + b { color: #ff5fae; font-size: 72px; }
.mascot { font-size: 96px; margin-top: 4dvh; animation: drive 1.6s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(19,48,107,.3)); }
@keyframes drive { 0%,100% { transform: translateX(-24px) rotate(-3deg); } 50% { transform: translateX(24px) rotate(3deg); } }
.homeplay { margin-top: auto; margin-bottom: 18px; width: min(270px, 74%); padding: 10px 0 12px; border-radius: 26px; font-weight: 700; font-size: 34px; line-height: 1;
  background: linear-gradient(180deg, #7ff05c 0%, #24b33a 100%); border: 4px solid var(--line);
  box-shadow: inset 0 5px 0 rgba(255,255,255,.4), inset 0 -6px 0 rgba(0,70,10,.3), 0 6px 0 var(--line); animation: pulse 1.1s infinite ease-in-out; }
.homeplay small { display: block; font-size: 17px; opacity: .95; margin-bottom: 2px; }
.nav { width: calc(100% - 20px); margin: 0 10px max(10px, env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: flex-end;
  padding: 6px 4px; border-radius: 22px; }
.nav button { background: none; color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 2px 0 var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; width: 30%; padding: 4px 0; border-radius: 16px; }
.nav button i { font-style: normal; font-size: 34px; filter: drop-shadow(0 3px 0 var(--line)); }
.nav button.on { background: rgba(255,255,255,.18); transform: translateY(-6px); }
.nav button.on i { font-size: 42px; }

/* ----- home scenery (original, CSS only) ----- */
.home { background:
  radial-gradient(ellipse 60px 26px at 18% 21%, #fff 98%, transparent), radial-gradient(ellipse 44px 20px at 26% 19%, #fff 98%, transparent),
  radial-gradient(ellipse 70px 28px at 82% 15%, #fff 98%, transparent), radial-gradient(ellipse 46px 22px at 74% 13%, #fff 98%, transparent),
  linear-gradient(180deg, #1fa2ff 0%, #5fd0ff 38%, #b9f0ff 56%, transparent 56.2%),
  repeating-linear-gradient(90deg, #ffffff 0 18px, transparent 18px 34px) 0 66% / 100% 16px no-repeat,
  linear-gradient(180deg, transparent 56%, #8ee05a 56%, #8ee05a 60%, #7d8aa3 60%, #7d8aa3 74%, #8ee05a 74%) !important; }
.home::before { content: ''; position: absolute; left: -10%; right: -10%; bottom: 0; height: 22%; pointer-events: none;
  background: radial-gradient(circle at 8% 40%, #43c84a 22%, transparent 23%), radial-gradient(circle at 26% 30%, #5bd655 20%, transparent 21%),
    radial-gradient(circle at 46% 45%, #43c84a 21%, transparent 22%), radial-gradient(circle at 66% 32%, #5bd655 22%, transparent 23%),
    radial-gradient(circle at 88% 42%, #43c84a 22%, transparent 23%), linear-gradient(transparent 45%, #3fbf45 45%); }
.home > * { position: relative; z-index: 1; }
.logo .sub { display: inline-block; margin-top: 8px; padding: 4px 22px; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 1px;
  background: linear-gradient(180deg, #c06bff, #8a2be2); border: 3px solid var(--line); border-radius: 10px; transform: rotate(2deg);
  clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%); }
.logo b { -webkit-text-stroke: 0; }
.mascot { margin-top: 8dvh !important; }
/* ----- settings / shop rows ----- */
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 4px; font-weight: 700; font-size: 18px; }
.sw { width: 64px; height: 34px; border-radius: 99px; border: 3px solid var(--line); background: #c9c0d8; position: relative; }
.sw::after { content: ''; position: absolute; top: 2px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--line); transition: left .15s; }
.sw.on { background: #45cf4f; }
.sw.on::after { left: 31px; }
.shopitem { display: flex; align-items: center; gap: 10px; text-align: left; }
.shopitem .ic { font-size: 34px; }
.shopitem .nm { flex: 1; font-size: 16px; line-height: 1.15; }
.shopitem .nm small { display: block; font-weight: 600; opacity: .7; font-size: 12px; }
.buy { padding: 6px 10px; border-radius: 12px; font-weight: 700; font-size: 15px; color: #fff; text-shadow: 0 2px 0 var(--line); border: 3px solid var(--line);
  background: linear-gradient(180deg, #7ff05c 0%, #24b33a 100%); white-space: nowrap; }
.buy:disabled { filter: grayscale(.8); opacity: .7; }
.reward { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 30px; font-weight: 700; color: #ffd84a; text-shadow: 0 3px 0 var(--line); }
/* Small motion polish; keep home mounted so hidden can transition. */
.home { opacity: 1; transform: translateY(0); visibility: visible; transition: opacity .24s ease, transform .24s ease, visibility 0s; }
.home.hidden { display: flex; opacity: 0; transform: translateY(14px); visibility: hidden; pointer-events: none; transition-delay: 0s, 0s, .24s; }

.modal .card { animation: none; }
:is(#modal, #lsel, #settings, #shop):not(.hidden) > .card { animation: toyPop .36s ease-out; }
@keyframes toyPop {
  0% { opacity: 0; transform: translateY(10px) scale(.88); }
  65% { opacity: 1; transform: translateY(-2px) scale(1.035); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.homeplay { animation: homeBob 2.4s ease-in-out infinite; }
@keyframes homeBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
button:active:not(:disabled) { animation: none !important; transform: translateY(3px) scale(1.03, .92) !important; }
.nav button.on:active:not(:disabled) { transform: translateY(-3px) scale(1.03, .92) !important; }
.nav button:active i { animation: navWiggle .28s ease-in-out; }
@keyframes navWiggle { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-12deg); } 70% { transform: rotate(10deg); } }

#lsel:not(.hidden) .lv { animation: toyPop .3s ease-out backwards; animation-delay: calc(min(var(--i, 0), 12) * 25ms); }

.pill { position: relative; }
.pill::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(110deg, transparent 42%, rgba(255,255,255,.45) 50%, transparent 58%) 160% 0 / 250% 100% no-repeat; animation: coinShine 4.8s ease-in-out infinite; }
@keyframes coinShine { 0%, 78% { background-position: 160% 0; } 100% { background-position: -160% 0; } }

@media (prefers-reduced-motion: reduce) {
  .shell, .shell *, .shell *::before, .shell *::after { animation: none !important; transition: none !important; }
  .home.hidden { transform: none; }
  .pill::after { content: none; }
}
</style>

<body>
<div class="shell" id="frame">
  <canvas id="scene"></canvas>
  <div class="ripple" id="ripple"></div>
  <div class="hand" id="hand">👆</div>

  <header class="hud" id="hud">
    <div class="pill panel" id="coinPill"><span class="coin">$</span><span id="coins">0</span></div>
    <div class="level outline" id="level">Màn 1</div>
    <div class="right">
      <button class="rbtn panel" id="soundBtn" title="Cài đặt">⚙️</button>
      <button class="rbtn panel" id="restart" title="Chơi lại">↻</button>
      <button class="rbtn panel" id="homeBtn" title="Trang chủ">🏠</button>
    </div>
  </header>
  <div class="toast panel" id="toast">👆 Kéo từ xe để vẽ đường</div>

  <nav class="dock" id="dock">
    <div class="boosts">
      <button class="boost panel" id="undo" title="Lùi 1 ô">↶</button>
      <button class="boost panel" id="hint" title="Gợi ý">💡</button>
      <button class="boost panel" id="demo" title="Xem mẫu">🎬</button>
    </div>
    <div class="mid"><div class="cnt panel" id="cnt">🧍 <span id="cntText">0/0</span></div></div>
    <button class="play off outline" id="play">▶ CHẠY</button>
  </nav>

  <div class="modal hidden" id="modal">
    <div class="card panel">
      <div class="ribbon outline" id="mTitle">TUYỆT VỜI!</div>
      <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
      <div class="big" id="mBig" style="display:none">🚧</div>

/* =========================================================
   CAMERA FIT — board fills the width, sits between HUD and dock
   ========================================================= */
function fit() {
  const fr = $('frame').getBoundingClientRect();
  const Wd = Math.max(10, fr.width), Ht = Math.max(10, fr.height);
  renderer.setSize(Wd, Ht, false);
  camera.aspect = Wd / Ht; camera.clearViewOffset(); camera.updateProjectionMatrix();
  const top = $('toast').getBoundingClientRect().bottom - fr.top + 8;
  const bottom = $('dock').getBoundingClientRect().top - fr.top - 12;
  const n = L.size, h = n / 2 + 0.45;
  const pts = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) for (const y of [0, 0.55]) pts.push(new THREE.Vector3(sx * h, y, sz * h));
  const elev = THREE.MathUtils.degToRad(66);
  const dir = new THREE.Vector3(0, Math.sin(elev), Math.cos(elev));
  const measure = d => {
    camera.position.copy(dir).multiplyScalar(d); camera.lookAt(0, 0, 0); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of pts) { const q = p.clone().project(camera); const px = (q.x + 1) / 2 * Wd, py = (1 - q.y) / 2 * Ht; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
    return { w: x1 - x0, h: y1 - y0, cy: (y0 + y1) / 2 };
  };
  let lo = 2, hi = 80;
  for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2, m = measure(mid); if (m.w <= Wd - 12 && m.h <= bottom - top) hi = mid; else lo = mid; }
  const m = measure(hi);
  const shift = (top + bottom) / 2 - m.cy;
  camera.setViewOffset(Wd, Ht, 0, -shift, Wd, Ht);
  camera.updateProjectionMatrix();
  const s = n / 2 + 4;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: 40 });
  sun.shadow.camera.updateProjectionMatrix();
}

function toScreen(v) {
  const fr = $('frame').getBoundingClientRect();
  const q = v.clone().project(camera);
  return { x: (q.x + 1) / 2 * fr.width, y: (1 - q.y) / 2 * fr.height };
}
function hitGround(cx, cy) {
  const r = $('scene').getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1), camera);
  const v = new THREE.Vector3();
  return raycaster.ray.intersectPlane(plane0, v) ? v : null;
}
function cellAt(cx, cy) {
  const v = hitGround(cx, cy); if (!v) return null;
  const x = Math.round(v.x + (L.size - 1) / 2), y = Math.round(v.z + (L.size - 1) / 2);
  if (x < 0 || y < 0 || x >= L.size || y >= L.size) return null;
  return [x, y];
}

function clearScene() {
  while (root.children.length) { const c = root.children[0]; root.remove(c); disposeObj(c); }
  pickVis = []; stationVis = []; exitVis = []; busVis = []; routeObjs = []; blockVis = []; ambient = []; flags = [];
  jumpers = []; cheer = []; fx = [];
}
let session = 0;
function later(fn, ms) { const s = session; return setTimeout(() => { if (s === session) fn(); }, ms); }
function reset(i = lvl) {
  session++;
  clearTimeout(autoT); clearTimeout(endT); autoT = endT = null;
  lvl = (i + LEVELS.length) % LEVELS.length; L = LEVELS[lvl];
  store.set('bl_lvl', lvl);
  $('frame').style.background = THEMES[theme].bg;
  paths = L.buses.map(b => [b.start.slice()]);
  sel = 0; mode = 'draw'; drawing = false; hint = false; hintUsed = false; demoUsed = false; demoQ = null; speed = 1;
  taken = L.pickups.map(() => 0); delivered = 0; shown = 0; shownPeople = 0; runners = []; idleT = 0;

  fit();

/* ---------- board (minimal, clean) ---------- */
function softShadowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 18, 64, 64, 64);
  g.addColorStop(0, 'rgba(140,70,60,.28)'); g.addColorStop(1, 'rgba(140,70,60,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
function buildWorld() {
  const n = L.size, T = THEMES[theme];
  const sh = mk(new THREE.PlaneGeometry(n + 3.4, n + 3.4), new THREE.MeshBasicMaterial({ map: softShadowTex(), transparent: true, depthWrite: false }), root, 0.3, -0.5, 0.55, false);
  sh.rotation.x = -Math.PI / 2;
  mk(RB(n + 0.62, 0.22, n + 0.62, 0.26), M(0xe0a98a, 0.7), root, 0, -0.3, 0);
  mk(RB(n + 0.5, 0.36, n + 0.5, 0.22), M(T.plateau, 0.6), root, 0, -0.18, 0);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const w = W([x, y]);
    mk(RB(0.9, 0.04, 0.9, 0.12), M((x + y) % 2 ? T.tileB : T.tileA, 0.8, false, false), root, w.x, 0, w.z, false);
  }
  L.blocks.forEach((p, i) => createBlock(p, i));
  L.stations.forEach((p, i) => { createStation(p, i); const c = L.stationColors[i]; if (c) { const st = stationVis[i]; paintStation(st, c); st.open = 0; mk(CYL(0.17, 0.2, 0.04, 24), M(COLORS[c]), st.g, 0, 0.02, 0); } });
  L.cross.forEach(p => createCross(p));
  L.tp.forEach((tp, k) => { createPortal(tp.a, k); createPortal(tp.b, k); });
  L.pickups.forEach((p, i) => createPickup(p, i));
  L.buses.forEach((b, i) => { createExit(b, i); createBus(b, i); });
}

/* ---------- overpass: z-direction drives over the bridge, x-direction passes underneath ---------- */
const BRIDGE_H = 0.82;
function createCross(p) {
  const g = new THREE.Group(); g.position.copy(W(p)); root.add(g);
  const deckM = M(0xfff1dc), sideM = M(0x5aa8ff), railM = M(0xffffff);
  mk(RB(0.7, 0.1, 1.0, 0.04), deckM, g, 0, BRIDGE_H - 0.05, 0);
  mk(RB(0.74, 0.08, 1.02, 0.03), sideM, g, 0, BRIDGE_H - 0.13, 0);
  for (const sx of [-1, 1]) {
    mk(RB(0.05, 0.1, 1.0, 0.02), railM, g, sx * 0.36, BRIDGE_H + 0.04, 0);
    for (const sz of [-1, 1]) {
      mk(RB(0.1, BRIDGE_H - 0.15, 0.1, 0.03), sideM, g, sx * 0.4, (BRIDGE_H - 0.15) / 2, sz * 0.46);
      // ramps reaching into the neighbouring cells along z
      const run = 0.92, len = Math.hypot(run, BRIDGE_H), ang = Math.atan2(BRIDGE_H, run);
      const ramp = mk(RB(0.7, 0.07, len, 0.03), deckM, g, 0, BRIDGE_H / 2 - 0.035 * Math.cos(ang), sz * (0.5 + run / 2));
      ramp.rotation.x = sz * ang;
    }
  }
}

/* ---------- teleport tube ---------- */
const PORTAL_COLORS = [0x8a5cff, 0x13b9d6, 0xff7a3d];
let portalTex = null;
function swirlTex() {
  if (portalTex) return portalTex;
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.translate(64, 64);
  for (let a = 0; a < 3; a++) { x.rotate(Math.PI * 2 / 3); x.beginPath(); for (let k = 0; k < 60; k++) { const r = k, th = k * 0.09; x.lineTo(Math.cos(th) * r, Math.sin(th) * r); } x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 9; x.lineCap = 'round'; x.stroke(); }
  portalTex = new THREE.CanvasTexture(c); portalTex.colorSpace = THREE.SRGBColorSpace; portalTex.userData.shared = true; return portalTex;
}
function createPortal(p, k) {
  const col = PORTAL_COLORS[k % PORTAL_COLORS.length];
  const g = new THREE.Group(); g.position.copy(W(p)); root.add(g);
  const rim = mk(G('ptorus', () => new THREE.TorusGeometry(0.32, 0.07, 12, 32)), M(col), g, 0, 0.06, 0); rim.rotation.x = Math.PI / 2;
  mk(CYL(0.3, 0.3, 0.03, 32), M(shade(col, 0.55), 0.5, false, false), g, 0, 0.045, 0, false);
  const sw = new THREE.Mesh(G('pdisc', () => new THREE.CircleGeometry(0.28, 32).rotateX(-Math.PI / 2)), new THREE.MeshBasicMaterial({ map: swirlTex(), color: tint(col, 0.3), transparent: true, depthWrite: false }));
  sw.position.y = 0.065; g.add(sw);
  ambient.push({ type: 'spinY', obj: sw });
}
function tpFx(a, b) {
  const wa = W(a), wb = W(b); ringFx(wa, 0x8a5cff, 1.2, 0.5); ringFx(wb, 0x13b9d6, 1.2, 0.5);
  tone(500, 0.18, 'sine', 0.07, 1400); tone(1400, 0.2, 'sine', 0.05, 600, 0.12);
}

/* ---------- rounded square pad with coloured rim ---------- */
function pad(g, top, rim) {
  mk(RB(0.9, 0.1, 0.9, 0.18), M(rim, 0.45), g, 0, 0.05, 0);
  mk(RB(0.76, 0.03, 0.76, 0.14), M(top, 0.6), g, 0, 0.1, 0, false);
  const glow = new THREE.Mesh(RING(0.56, 0.68), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false }));
  glow.position.y = 0.03; g.add(glow);
  return glow;
}

/* ---------- badges ---------- */
function badgeTex(text, bg, fg = '#fff') {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,.15)'; x.beginPath(); x.arc(64, 70, 54, 0, 7); x.fill();
  x.fillStyle = '#fff'; x.beginPath(); x.arc(64, 64, 56, 0, 7); x.fill();
  x.fillStyle = bg; x.beginPath(); x.arc(64, 64, 46, 0, 7); x.fill();
  x.fillStyle = fg; x.font = `700 ${text.length > 2 ? 44 : 62}px Fredoka, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 64, 68);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeBadge(text, bg, fg) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: badgeTex(text, bg, fg), depthWrite: false, depthTest: false }));
  s.scale.set(0.34, 0.34, 1); s.renderOrder = 20; return s;
}
function setBadge(s, text, bg, fg) {
  if (s.userData.text === text + bg) return; s.userData.text = text + bg;
  s.material.map.dispose(); s.material.map = badgeTex(text, bg, fg); s.material.needsUpdate = true;
}

/* ---------- passenger: glossy toy stick-figure with limbs ---------- */
function limb(parent, m, x, y, r, len, z = 0) {
  const pivot = new THREE.Group(); pivot.position.set(x, y, z); parent.add(pivot);
  mk(CAP(r, len), m, pivot, 0, -(len / 2 + r * 0.6), 0);
  return pivot;
}
function person(colorName, s = 1) {
  const g = new THREE.Group(), c = COLORS[colorName];
  const m = M(c);
  const legL = limb(g, m, -0.03, 0.08, 0.027, 0.03), legR = limb(g, m, 0.03, 0.08, 0.027, 0.03);
  mk(CAP(0.056, 0.045), m, g, 0, 0.135, 0);
  const armL = limb(g, m, -0.064, 0.165, 0.023, 0.04), armR = limb(g, m, 0.064, 0.165, 0.023, 0.04);
  armL.rotation.z = -0.3; armR.rotation.z = 0.3;
  mk(SPH(0.102, 24, 16), m, g, 0, 0.275, 0);
  g.scale.setScalar(s);
  g.userData = { s, phase: Math.random() * 6, armL, armR, legL, legR };
  return g;
}
function pose(pp, kind, t) {
  const u = pp.userData; if (!u.armL) return;
  if (kind === 'run') {
    const a = Math.sin(t) * 0.9;
    u.legL.rotation.x = a; u.legR.rotation.x = -a; u.armL.rotation.x = -a; u.armR.rotation.x = a;
    u.armL.rotation.z = -0.25; u.armR.rotation.z = 0.25;
  } else if (kind === 'cheer') {
    const a = Math.sin(t) * 0.35;
    u.armL.rotation.set(0, 0, -2.6 + a); u.armR.rotation.set(0, 0, 2.6 - a);
    u.legL.rotation.x = u.legR.rotation.x = 0;
  } else if (kind === 'wave') {
    u.armL.rotation.set(0, 0, -0.25); u.armR.rotation.set(0, 0, 2.4 + Math.sin(t) * 0.5);
    u.legL.rotation.x = u.legR.rotation.x = 0;
  } else if (kind === 'sit') {
    u.legL.rotation.x = u.legR.rotation.x = -1.4;
    u.armL.rotation.set(-0.5, 0, -0.35); u.armR.rotation.set(-0.5, 0, 0.35);
  } else {
    const a = Math.sin(t) * 0.12;
    u.armL.rotation.set(a, 0, -0.25); u.armR.rotation.set(-a, 0, 0.25);
    u.legL.rotation.x = u.legR.rotation.x = 0;
  }
}


/* ---------- PICKUP: coloured pad + crowd ---------- */
function createPickup(p) {
  const g = new THREE.Group(); g.position.copy(W(p.at)); root.add(g);
  const c = COLORS[p.color];
  const glow = pad(g, tint(c, 0.6), c);
  const per = perUnit(), N = per * p.count, s = N > 12 ? 0.8 : 0.9;
  const units = [];
  for (let u = 0; u < p.count; u++) units.push([]);
  for (let k = 0; k < N; k++) {
    const r = 0.3 * Math.sqrt((k + 0.5) / N), a = k * 2.39996;
    const pp = person(p.color, s);
    pp.position.set(Math.cos(a) * r, 0.115, Math.sin(a) * r);
    g.add(pp); units[Math.floor(k / per)].push(pp);
  }
  const badge = makeBadge(String(p.count * perUnit()), hex(p.color)); badge.position.set(0.34, 0.62, -0.3); g.add(badge);
  pickVis.push({ g, units, remain: p.count, glow, badge, color: p.color, reserved: 0, shake: 0 });
}

/* ---------- STATION: flag on a grey post, turns the colour of delivered riders ---------- */

  const g = new THREE.Group(); g.position.copy(W(p)); root.add(g);
  const glow = new THREE.Mesh(RING(0.36, 0.46), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false }));
  glow.position.y = 0.03; g.add(glow);

  const post = new THREE.Group(); post.rotation.z = -0.12; post.rotation.y = 0.5; post.scale.setScalar(1.4); g.add(post);
  mk(CYL(0.032, 0.038, 0.58, 12), M(0x8f98a8), post, 0, 0.31, 0);
  const flagM = MT(0xffffff);
  const flag = mk(RB(0.36, 0.22, 0.09, 0.05), flagM, post, 0.06, 0.62, 0);

}
function paintStation(st, colorName) {
  const c = COLORS[colorName];
  st.flag.material.color.setHex(c);
  st.flag.material.userData.outlineParameters.color = outlineOf(c);
  st.open = Math.max(st.open, 0.6);

/* ---------- BUS: chunky open-top toy bus ---------- */

  const paint = M(c), cream = M(0xfbe9cf), creamD = M(0xe9cfa8), trim = M(0xf4f6fa), tire = M(0x2b2f3a);

  mk(RB(0.8, 0.36, 0.24, 0.12), paint, body, 0, 0.5, -0.53);
  mk(RB(0.66, 0.2, 0.04, 0.03), glass, body, 0, 0.56, -0.655, false);
  mk(RB(0.72, 0.05, 0.24, 0.025), trim, body, 0, 0.7, -0.53, false);
  for (const sx of [-1, 1]) {
    mk(CYL(0.062, 0.062, 0.04, 20), trim, body, sx * 0.28, 0.3, -0.66, false).rotation.x = Math.PI / 2;
    mk(CYL(0.045, 0.045, 0.045, 20), M(0xfff3c2), body, sx * 0.28, 0.3, -0.666, false).rotation.x = Math.PI / 2;
    mk(RB(0.1, 0.06, 0.03, 0.015), M(0xff4b4b), body, sx * 0.29, 0.34, 0.655, false);

/* =========================================================
   SIMULATION (shared by preview, verify and runtime planning)
   ========================================================= */

      if (p[0] < 0 || p[1] < 0 || p[0] >= q.size || p[1] >= q.size || own.has(k)) return false;
      own.add(k);
      if (q.blocks.some(x => eq(x, p)) || q.stations.some(x => eq(x, p)) || q.pickups.some(x => eq(x.at, p))) return false;
      if (q.buses.some(o => o !== b && (eq(o.start, p) || eq(o.end, p)))) return false;
      const n = (use.get(k) || 0) + 1; use.set(k, n);

        const a = r[i - 1], c = r[i + 1];

/* =========================================================

function blockReason(p, i) {
  if (p[0] < 0 || p[1] < 0 || p[0] >= L.size || p[1] >= L.size) return null;
  if (L.pickups.some(q => eq(q.at, p))) return 'Không đi xuyên qua cờ khách 🚩';
  if (L.stations.some(q => eq(q, p))) return 'Không đi xuyên qua trạm 🏳️';
  if (L.blocks.some(q => eq(q, p))) return 'Có vật cản ở đây 🌳';
  if (L.buses.some((b, j) => j !== i && (eq(b.start, p) || eq(b.end, p)))) return 'Ô của xe khác 🚚';
  const others = paths.filter((r, j) => j !== i && r.some(q => eq(q, p))).length;
  if (others && (!isCross(L, p) || others > 1)) return 'Trùng đường xe khác 💥';
  return '';
}

    // standing on a tube we drove into: the only way on is the partner tube
    if (blockReason(tpPair, i) !== '') { if (!quiet) { flashCell(tpPair); toast('Ống bên kia bị chặn', 'bad'); SFX.bad(); } return false; }
    r.push(tpPair.slice()); jumpLock = !quiet; tpFx(tip, tpPair);
    if (!quiet) toast('Vẽ tiếp từ ống bên kia 🌀', 'good');
    onPathsChanged(); return true;
  }
  let why = blockReason(p, i);
  if (why === null) return false;
  if (!why && r.length >= 2 && isCross(L, tip)) {
    const prev = r[r.length - 2];
    if (p[0] - tip[0] !== tip[0] - prev[0] || p[1] - tip[1] !== tip[1] - prev[1]) why = 'Phải đi thẳng qua cầu vượt ➡️';
  }
  if (!why && eq(p, L.buses[i].end) && isCross(L, p)) why = 'Không dừng trên cầu vượt';

    return false;
  }
  r.push(p.slice()); lastBad = null;

  if (eq(p, L.buses[i].end)) finishRoute(i);

    const q = pairOf(L, p); r.push(q.slice()); jumpLock = !quiet; tpFx(p, q);

}
function pickAnim(bus, pv, fromCargo, n, delay) {
  const per = bus.userData.per; let k = 0;
  for (let u = 0; u < n; u++) {
    const unit = pv.units[pv.remain - 1 - u] || [];
    const slotUnit = fromCargo + u;
    unit.forEach((pp, idx) => {
      const slot = bus.userData.slots[slotUnit * per + idx];
      root.attach(pp);
      const to = slot ? slotWorld(bus, slotUnit * per + idx) : bus.position.clone().setY(0.5);
      jump(pp, to, 0.42, delay + k * 0.07, 0.75, () => SFX.hop(), () => {
        root.remove(pp); disposeObj(pp);
        if (slot) { slot.visible = true; slot.userData.pop = 1; }
        bus.userData.squash = 1;
        floatLabel(to.clone().setY(1.2).add(new THREE.Vector3((Math.random() - 0.5) * 0.24, 0, (Math.random() - 0.5) * 0.24)), '+1', hex(L.buses[busVis.indexOf(bus)].color));
      });
      k++;
    });
  }
  pv.remain -= n;
  setBadge(pv.badge, pv.remain ? String(pv.remain * perUnit()) : '✓', pv.remain ? hex(pv.color) : '#2fcf55');
  return delay + k * 0.07 + 0.45;
}
function dropAnim(bus, st, n, color) {
  const per = bus.userData.per, list = [];
  for (let k = n * per - 1; k >= 0; k--) { const s = bus.userData.slots[k]; if (s && s.visible) list.push(k); }
  const center = st.g.position;
  list.forEach((k, idx) => {
    const from = slotWorld(bus, k); bus.userData.slots[k].visible = false;
    const pp = person(color, 0.85); pp.position.copy(from); root.add(pp);
    const a = Math.random() * Math.PI * 2, rr = 0.12 + Math.random() * 0.2;
    const to = new THREE.Vector3(center.x + Math.cos(a) * rr, 0.11, center.z + Math.sin(a) * rr + 0.05);
    const unitEnd = idx % per === per - 1;
    jump(pp, to, 0.4, idx * 0.06, 0.6, idx === 0 ? () => SFX.drop() : null, () => {
      if (idx === 0) st.open = Math.max(st.open, 0.6);
      cheer.push({ obj: pp, life: 0.9 + Math.random() * 0.3, t: 0 });
      shownPeople++; bump('cnt'); refreshUI();

}

  toast(won ? 'Hoàn thành! 🎉' : 'Chưa đủ khách rồi 😢', won ? 'good' : 'bad');

    const stars = 3;
    coins += 30; store.set('bl_coins', coins);

/* =========================================================
   MAIN LOOP
   ========================================================= */
function stepDemo(dt) {
  demoQ.t -= dt; if (demoQ.t > 0) return;
  demoQ.t = 0.11;
  const b = L.buses[demoQ.bus];
  if (!b) { demoQ = null; startRun(); return; }
  sel = demoQ.bus;
  if (demoQ.k < b.solution.length && eq(paths[sel].at(-1), b.solution[demoQ.k])) { demoQ.k++; demoQ.t = 0.02; return; }
  if (demoQ.k < b.solution.length) { drawing = true; tryExtend(b.solution[demoQ.k], true); drawing = false; demoQ.k++; clearTimeout(autoT); autoT = null; }
  else { demoQ.bus++; demoQ.k = 1; demoQ.t = 0.35; }
}

function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }
function bridgeAnchors(r) {
  // distances along this runner's road where it crosses OVER a bridge (vertical pass through a cross cell)
  if (r.overs) return r.overs;
  r.overs = [];
  r.route.forEach((p, i) => {
    if (!isCross(L, p) || i === 0 || i === r.route.length - 1) return;
    if (r.route[i - 1][0] === p[0] && r.route[i + 1][0] === p[0]) r.overs.push(r.pl.anchors[i]);
  });
  return r.overs;
}
function tunnelY(r) {
  for (const a of bridgeAnchors(r)) {
    const d = Math.abs(r.dist - a);
    if (d < 1.42) return BRIDGE_H * easeInOut(clamp((1.42 - d) / 0.92, 0, 1));
  }
  return 0;
}
function settle(u, dt) {
  const k = 1 - Math.exp(-dt * 7);
  u.lean = lerp(u.lean, 0, k); u.pitch = lerp(u.pitch, 0, k);
  u.body.rotation.z = u.lean; u.body.rotation.x = u.pitch;
}
function teleportStep(r, bus, u, dt) {
  if (r.pause > 0) { r.pause -= dt; settle(u, dt); return; }
  r.tp = Math.min(1, r.tp + dt / 0.75);
  const s = r.tp;
  if (s < 0.42) {
    const k = s / 0.42; bus.scale.setScalar(u.baseScale * (1 - easeInOut(k))); u.heading += dt * 14 * k; bus.rotation.y = u.heading; bus.position.y = -0.1 * k;
  } else {
    if (!r.tpMid) {
      r.tpMid = true; const a = r.route[r.at];
      r.at++; r.dist = r.pl.anchors[r.at]; r.v = 0;
      const p = sampleAt(r.pl, r.dist); bus.position.set(p.x, 0, p.z);
      const h = headingAt(r.pl, r.dist + 0.05); if (h !== null) { u.heading = h; bus.rotation.y = h; }
      sparkle(W(a), 0x8a5cff, 10); sparkle(W(r.route[r.at]), 0x13b9d6, 10); tone(1200, 0.16, 'sine', 0.06, 500);
      arrive(r);
    }
    const k = (s - 0.42) / 0.58, back = 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
    bus.scale.setScalar(u.baseScale * Math.max(0.001, back)); bus.position.y = 0;
  }
  if (s >= 1) { bus.scale.setScalar(u.baseScale); if (r.state === 'tp') r.state = 'drive'; }
}
function updateRunners(dt) {
  const VMAX = 2.5, ACC = 3.4, DEC = 7;
  for (const r of runners) {
    const bus = busVis[r.i], u = bus.userData;
    if (r.state === 'done') continue;
    if (r.state === 'tp') { teleportStep(r, bus, u, dt); continue; }
    if (r.pause > 0) { r.pause -= dt; r.v = 0; settle(u, dt); continue; }
    if (r.state === 'stuck') {
      r.state = 'done'; r.failed = true; u.shake = 1;
      floatLabel(bus.position.clone().setY(1.4), '!', '#ff3b3b'); continue;
    }
    if (r.state === 'exit') {
      r.exit = Math.min(1, r.exit + dt / 0.5);
      const e = r.exit, h = u.heading, end = sampleAt(r.pl, r.pl.length);
      bus.position.x = end.x - Math.sin(h) * e * 0.35;
      bus.position.z = end.z - Math.cos(h) * e * 0.35;
      bus.scale.setScalar(u.baseScale * (1 - e * e));
      settle(u, dt);
      if (e >= 1) { r.state = 'done'; bus.visible = false; exitVis[r.i].bounce = 1; sparkle(W(r.b.end), COLORS[r.b.color], 16); SFX.exit(); }
      continue;
    }
    const target = r.pl.anchors[r.at + 1];
    const stopNext = r.ev.has(r.at + 1) || isJump(r.route, r.at + 1) || r.at + 1 === r.route.length - 1;
    // target speed: slow a little into tight corners, brake smoothly before stops
    const hNow = headingAt(r.pl, r.dist), hAhead = headingAt(r.pl, Math.min(pieceRange(r.pl, r.dist)[1], r.dist + 0.45));
    const turn = hNow === null || hAhead === null ? 0 : Math.abs(angDiff(hAhead, hNow));
    let vt = VMAX * (1 - Math.min(0.4, turn * 0.34));
    if (stopNext) vt = Math.min(vt, Math.sqrt(2 * DEC * Math.max(0, target - r.dist)) + (r.at + 1 === r.route.length - 1 ? 0.9 : 0.3));
    const vPrev = r.v;
    r.v = r.v < vt ? Math.min(vt, r.v + ACC * dt * (0.35 + 0.65 * (1 - r.v / VMAX))) : Math.max(vt, r.v - DEC * dt);
    const step = Math.min(Math.max(r.v, 0.05) * dt, target - r.dist);
    r.dist += step;
    const p = sampleAt(r.pl, r.dist);
    bus.position.x = p.x; bus.position.z = p.z;
    // heading follows a point slightly ahead, critically damped
    const want = headingAt(r.pl, Math.min(pieceRange(r.pl, r.dist)[1], r.dist + 0.16));
    const kH = 1 - Math.exp(-dt * 10);
    const dh = want === null ? 0 : angDiff(want, u.heading) * kH;
    u.heading += dh; bus.rotation.y = u.heading;
    // body roll outward of the turn, pitch with acceleration
    const w = dt > 0 ? dh / dt : 0, acc = dt > 0 ? (r.v - vPrev) / dt : 0;
    u.lean = lerp(u.lean, clamp(-w * r.v * 0.055, -0.22, 0.22), 1 - Math.exp(-dt * 9));
    u.pitch = lerp(u.pitch || 0, clamp(acc * 0.014, -0.08, 0.05), 1 - Math.exp(-dt * 7));
    u.body.rotation.z = u.lean; u.body.rotation.x = u.pitch;
    bus.position.y = tunnelY(r) + Math.sin(r.dist * 10) * 0.005 * (r.v / VMAX);
    u.wheels.forEach(wh => wh.rotation.x -= step / 0.15);
    r.puff -= dt;
    if (r.puff <= 0 && r.v > 0.6 && bus.position.y > -0.05) { r.puff = 0.14; bus.updateMatrixWorld(); puff(new THREE.Vector3(-0.26, 0.2, 0.72).applyMatrix4(bus.matrixWorld)); }
    if (r.dist >= target - 1e-5) { r.at++; arrive(r); }
  }
  if (!endT && runners.length && runners.every(r => r.state === 'done') && jumpers.length === 0 && cheer.length === 0) {
    endT = setTimeout(() => { endT = null; complete(); }, 300);
  }
}

/* ---------- performance: FPS meter + automatic quality step-down ---------- */
let quality = 2, perfAcc = 0, perfFrames = 0, perfWarm = 0, fpsShown = 0;
const showFps = /[?&]fps/.test(location.search);
const fpsEl = (() => { if (!showFps) return null; const d = document.createElement('div');
  d.style.cssText = 'position:absolute;left:8px;top:calc(max(10px, env(safe-area-inset-top)) + 96px);z-index:9;padding:3px 8px;border-radius:8px;background:rgba(40,20,20,.75);color:#fff;font:600 13px monospace;pointer-events:none';
  $('frame').appendChild(d); return d; })();
function setQuality(q) {
  quality = q;
  const dpr = window.devicePixelRatio || 1;
  renderer.setPixelRatio(Math.min(dpr, q === 2 ? (Math.min(screen.width, screen.height) < 600 ? 1.75 : 2) : q === 1 ? 1.5 : 1));
  renderer.shadowMap.enabled = q > 0;
  renderer.shadowMap.type = q === 2 ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  sun.shadow.mapSize.set(q === 2 ? 1024 : 512, q === 2 ? 1024 : 512);
  scene.traverse(o => { if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => m.needsUpdate = true); } });
  fit();
}
function trackPerf(rawDt) {
  if (document.hidden || rawDt > 0.25) return;
  perfAcc += rawDt; perfFrames++;
  if (perfAcc < 1) return;
  const fps = perfFrames / perfAcc; perfAcc = 0; perfFrames = 0; fpsShown = fps;
  if (fpsEl) fpsEl.textContent = Math.round(fps) + ' fps · Q' + quality;
  perfWarm++;
  if (perfWarm > 2 && fps < 40 && quality > 0) { setQuality(quality - 1); perfWarm = 0; }
}
function tick() {
  const raw = clock.getDelta();
  trackPerf(raw);
  update(Math.min(0.05, raw));
  if (quality > 0) effect.render(scene, camera); else renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
function update(dt) {
  T += dt;
  flushPaths();
  const sdt = mode === 'run' ? dt * speed : dt;
  if (demoQ) stepDemo(dt);

  // waving flags
  for (const f of flags) {
    const pos = f.geometry.attributes.position, b = f.userData.base;
    for (let i = 0; i < pos.count; i++) {
      const x = b[i * 3]; pos.array[i * 3 + 2] = Math.sin(x * 14 - T * 7 + f.userData.phase) * 0.045 * (x / f.userData.w);
    }
    pos.needsUpdate = true; f.geometry.computeVertexNormals();
  }
  // ambient props
  for (const a of ambient) {
    if (a.type === 'spin') a.obj.rotation.z -= dt * 1.4;
    else if (a.type === 'spinY') a.obj.rotation.y -= dt * 3;
    else if (a.type === 'sway') a.obj.rotation.z = Math.sin(T * 1.3 + a.obj.userData.sway) * 0.03;
    else if (a.type === 'pad') { const on = mode === 'draw' && a.i === sel; a.obj.material.opacity = on ? 0.55 + 0.35 * Math.sin(T * 6) : 0.3; a.obj.scale.setScalar(on ? 1 + 0.08 * Math.sin(T * 6) : 1); }
  }
  // crowds
  for (const v of pickVis) {
    const excited = mode === 'draw' && v.reserved > 0;
    let n = 0;
    for (let u = 0; u < v.remain; u++) for (const pp of v.units[u]) {
      const ph = pp.userData.phase; n++;
      const amp = excited ? 0.09 : 0.025, sp = excited ? 9 : 4;
      pp.position.y = 0.11 + Math.abs(Math.sin(T * sp + ph)) * amp;
      pose(pp, excited ? 'wave' : 'idle', T * (excited ? 9 : 3) + ph);
      if (Math.sin(T * 0.7 + ph * 3) > 0.985) pp.position.y += 0.06;
      pp.rotation.y = Math.sin(T * 0.8 + ph) * 0.5;
    }
    v.glow.material.opacity = excited ? 0.5 + 0.3 * Math.sin(T * 6) : 0;
    v.glow.material.color.setHex(excited ? COLORS[v.color] : 0xffffff);
    if (v.shake > 0) { v.shake -= dt; v.g.rotation.y = Math.sin(T * 40) * 0.08 * Math.min(1, v.shake); } else v.g.rotation.y = 0;
    v.badge.position.y = 0.72 + Math.sin(T * 3 + n) * 0.02;
  }
  for (const s of stationVis) {
    s.glow.material.opacity = mode === 'draw' && s.willDrop ? 0.45 + 0.3 * Math.sin(T * 6) : 0;
    if (s.open > 0) { s.open -= sdt; const k = 1 + Math.abs(Math.sin(T * 14)) * 0.06; s.g.scale.set(1 / Math.sqrt(k), k, 1 / Math.sqrt(k)); }
    else s.g.scale.lerp(new THREE.Vector3(1, 1, 1), dt * 8);
  }
  for (const e of exitVis) {
    if (e.bounce > 0) { e.bounce = Math.max(0, e.bounce - dt * 2.5); const k = Math.sin(e.bounce * Math.PI * 3) * 0.18 * e.bounce; e.arch.scale.set(1 - k, 1 + k, 1 - k); }
    e.ring.rotation.y += dt;
  }
  // buses idle / squash
  busVis.forEach((bus, i) => {
    const u = bus.userData;
    if (mode === 'draw') {
      const r = paths[i];
      if (r.length > 1 && near(r[0], r[1])) {
        const want = Math.atan2(-(r[1][0] - r[0][0]), -(r[1][1] - r[0][1]));
        let dh = want - u.heading; while (dh > Math.PI) dh -= Math.PI * 2; while (dh < -Math.PI) dh += Math.PI * 2;
        u.heading += dh * Math.min(1, dt * 10); bus.rotation.y = u.heading;
      }
      bus.position.y = 0;
      if (u.hop > 0) { u.hop = Math.max(0, u.hop - dt * 2.2); bus.position.y = Math.sin((1 - u.hop) * Math.PI) * 0.35; }
      else if (i === sel && !drawing && Math.sin(T * 2.5) > 0.96) u.hop = 1;
    }
    let sq = 0;
    if (u.squash > 0) { u.squash = Math.max(0, u.squash - dt * 3.5); sq = Math.sin(u.squash * Math.PI * 2) * 0.1 * u.squash; }
    else sq = Math.sin(T * 10 + i) * 0.008;
    u.body.scale.set(1 + sq, 1 - sq, 1 + sq);
    if (u.shake > 0) { u.shake -= dt * 0.7; u.body.position.x = Math.sin(T * 50) * 0.05 * u.shake; } else u.body.position.x = 0;
    for (const s of u.slots) {
      if (!s.visible) continue;
      if (s.userData.pop > 0) { s.userData.pop = Math.max(0, s.userData.pop - dt * 4); const k = 1 + Math.sin(s.userData.pop * Math.PI) * 0.5; s.scale.setScalar(0.82 * k); }
      s.position.y = s.userData.baseY + Math.abs(Math.sin(T * 6 + s.userData.phase)) * 0.02;
    }
  });
  // tip markers pulse
  tipMarks.forEach((m, k) => { if (m.geometry.type === 'RingGeometry') m.scale.setScalar(1 + 0.25 * Math.sin(T * 8)); else m.position.y = 0.09 + Math.abs(Math.sin(T * 6)) * 0.06; });
  chevronTex.offset.x -= dt * (mode === 'run' ? 2.2 : 1.1);

  if (mode === 'run') updateRunners(sdt);

  // jumpers
  jumpers = jumpers.filter(j => {
    if (j.delay > 0) { j.delay -= sdt; return true; }
    if (!j.started) { j.started = true; j.from.copy(j.obj.position); j.onStart && j.onStart(); }
    j.t = Math.min(1, j.t + sdt / j.dur);
    const t = easeInOut(j.t);
    j.obj.position.lerpVectors(j.from, j.to, t);
    j.obj.position.y += Math.sin(j.t * Math.PI) * j.h;
    j.obj.rotation.y = Math.atan2(j.to.x - j.from.x, j.to.z - j.from.z);
    const st = 1 + Math.sin(j.t * Math.PI) * 0.25;
    j.obj.scale.set(j.s / Math.sqrt(st), j.s * st, j.s / Math.sqrt(st));
    pose(j.obj, 'run', j.t * 22);
    if (j.t >= 1) { j.obj.scale.setScalar(j.s); j.onLand && j.onLand(); return false; }
    return true;
  });
  // cheering delivered passengers
  cheer = cheer.filter(c => {
    c.t += sdt; c.life -= sdt;
    c.obj.position.y = 0.11 + Math.abs(Math.sin(c.t * 11)) * 0.14;
    c.obj.rotation.y += sdt * 6; pose(c.obj, 'cheer', c.t * 14);
    if (c.life < 0.25) c.obj.scale.setScalar(Math.max(0.001, 0.85 * c.life / 0.25));
    if (c.life <= 0) { root.remove(c.obj); disposeObj(c.obj); return false; }
    return true;
  });
  // fx
  fx = fx.filter(e => {
    e.life -= dt; const k = Math.max(0, e.life / e.max);
    if (e.kind === 'ring') { e.obj.scale.setScalar(1 + (1 - k) * 2.5 * e.size); e.obj.material.opacity = k * 0.9; }
    else if (e.kind === 'spark') { e.vel.y -= 9 * dt; e.obj.position.addScaledVector(e.vel, dt); e.obj.rotation.x += dt * 8; e.obj.scale.setScalar(k); }
    else if (e.kind === 'puff') { e.obj.position.y += dt * 0.5; e.obj.scale.setScalar(1 + (1 - k) * 2); e.obj.material.opacity = k * 0.8; }
    else if (e.kind === 'flash') e.obj.material.opacity = k * 0.7;
    else if (e.kind === 'label') { e.obj.position.y += dt * 0.7; e.obj.material.opacity = Math.min(1, k * 2); const s = 0.8 * (1 + Math.max(0, (k - 0.8)) * 2); e.obj.scale.set(s, s / 2, 1); }
    if (e.life <= 0) { root.remove(e.obj); disposeObj(e.obj); return false; }
    return true;
  });

  updateHand(dt);
}

/* tutorial hand: shows the gesture when the player is idle */
function updateHand(dt) {
  const h = $('hand');
  const empty = paths.every(r => r.length === 1);
  if (mode === 'draw' && !drawing && !demoQ) idleT += dt; else idleT = 0;
  const show = mode === 'draw' && !drawing && !demoQ && empty && (lvl < 2 ? idleT > 0.8 : idleT > 5);
  if (!show) { h.style.display = 'none'; return; }
  const sol = L.buses[sel].solution, n = Math.min(sol.length, 4);
  const cyc = 2.2, t = ((idleT - 0.8) % cyc) / cyc;
  const f = clamp((t - 0.15) / 0.65, 0, 1) * (n - 1), k = Math.floor(f), fr = f - k;
  const a = W(sol[Math.min(k, n - 1)]), b = W(sol[Math.min(k + 1, n - 1)]);
  const p = toScreen(new THREE.Vector3(lerp(a.x, b.x, fr), 0.1, lerp(a.z, b.z, fr)));
  h.style.display = 'block'; h.style.left = p.x + 'px'; h.style.top = p.y + 'px';
  h.style.opacity = t > 0.88 ? (1 - t) / 0.12 : 1;
  h.style.transform = `translate(-30%, -10%) scale(${t < 0.15 ? 1.15 - t : 1})`;
}

/* test hooks */
window.__bus3dTest = {
  levels: LEVELS,
  verify: () => LEVELS.map(verify),
  reset,
  runDemo: () => $('demo').click(),
  getState: () => ({ lvl, mode, paths, delivered, total, theme, taken: taken.slice() }),
  cellToClient: p => { const s = toScreen(W(p)), r = $('frame').getBoundingClientRect(); return { x: s.x + r.left, y: s.y + r.top }; },
  closeup: (x, z, d = 2.6) => { camera.clearViewOffset(); camera.position.set(x + d * 0.5, d * 0.8, z + d); camera.lookAt(x, 0.25, z); camera.updateProjectionMatrix(); effect.render(scene, camera); },
  fit: () => fit(),
  busPos: i => busVis[i].position.clone(),
  quality: q => { if (q !== undefined) setQuality(q); return { quality, fps: Math.round(fpsShown) }; },
  audit: () => ({
    pickups: pickVis.map((v, j) => ({ people: v.units.reduce((s, u) => s + u.length, 0), badge: L.pickups[j].count * perUnit() })),
    buses: busVis.map((b, i) => ({ seats: b.userData.slots.length, badgeCap: capOf(L, L.buses[i]) * perUnit() })),
    counter: $('cntText').textContent
  }),
  snap: () => { effect.render(scene, camera); return $('scene').toDataURL('image/jpeg', 0.7); },
  step: (sec = 1) => { for (let t = 0; t < sec; t += 1 / 30) update(1 / 30); effect.render(scene, camera); return mode; },
  solveNow: () => { paths = L.buses.map(b => b.solution.map(p => p.slice())); onPathsChanged(); startRun(); }
};

const fontWait = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('700 20px Fredoka'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontWait.then(init, init);
</script>

    const x = document.getElementById('loading');
    if (x) x.innerHTML = '<div style="font-size:40px">⚠️</div><div style="text-align:center;padding:0 20px">Không tải được thư viện 3D.<br>Hãy kết nối internet rồi mở lại.</div>';
  }
});
</script>
